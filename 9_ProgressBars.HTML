<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9. Progress Bars
</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
</head>

<body class="container mx-auto">
      <h2>Course Progress Bar</h2>
    <div class="progress font-monospace" style="height: 40px;">
        <div class="progress-bar" style="width: 100%;">HTML</div>
        <div class="progress-bar bg-info" style="width: 80%;">CSS</div>
        <div class="progress-bar bg-success" style="width: 60%;">Bootstrap</div>
        <div class="progress-bar bg-primary" style="width: 40%;">JavaScript</div>
        <div class="progress-bar bg-danger" style="width: 20%;">React JS</div>
    </div>
</body>

</html>
